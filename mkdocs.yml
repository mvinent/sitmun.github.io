site_name: Documentación de SITMUN 3
repo_url: https://github.com/sitmun/sitmun.github.io
repo_name: sitmun/sitmun.github.io
site_url: https://sitmun.github.io

theme:
  name: material
  palette:
    primary: black
  logo: https://raw.githubusercontent.com/sitmun/community/master/Isotip%20SITMUN/PNG/02.principal-transparent-28x28.png
  favicon: https://raw.githubusercontent.com/sitmun/community/master/Isotip%20SITMUN/PNG/02.principal-transparent-28x28.png
  features:
    - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    # - header.autohide
    # - navigation.expand
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    # - navigation.prune
    - navigation.sections
    - navigation.tabs
    # - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    # - toc.integrate
  language: es
  icon:
    repo: fontawesome/brands/github
    admonition:
      info: octicons/browser-16

extra_css: [css/extra.css]
extra_javascript: [js/checklists.js]

plugins:
  - search
  - render_swagger
  - autorefs  
  - redirects:
      redirect_maps:
        getting-started/que-es.md: que-es-sitmun/descripcion/index.md
        getting-started/requisitos.md: usuario/primeros-pasos/requisitos.md
        getting-started/instalacion.md: usuario/primeros-pasos/instalacion.md
        getting-started/creando.md: usuario/guias/primer-proyecto/index.md
        getting-started/personalizando.md: usuario/guias/personalizacion.md
        features-client.md: que-es-sitmun/descripcion/clientes.md
        features-server.md: que-es-sitmun/descripcion/servidores.md
        roadmap.md: que-es-sitmun/hoja-de-ruta/index.md
        roadmap/mas-info-avanzado.md: que-es-sitmun/hoja-de-ruta/propuestas/mas-info-avanzado.md
        roadmap/mejora-ui-login-dashboard-cliente.md: que-es-sitmun/hoja-de-ruta/propuestas/mejora-ui-login-dashboard-cliente.md
        roadmap/app-turismo.md: que-es-sitmun/hoja-de-ruta/propuestas/app-turismo.md
        roadmap/informe.md: que-es-sitmun/hoja-de-ruta/propuestas/informe.md
        architecture.md: que-es-sitmun/arquitectura/index.md
        design.md: que-es-sitmun/arquitectura/diseno.md
        api.md: que-es-sitmun/arquitectura/api.md
        configuration.md: usuario/primeros-pasos/configuracion.md
        management.md: desarrollador/contribuir.md
        troubleshooting.md: usuario/primeros-pasos/solucion-problemas.md
        license.md: red-sitmun/licencia.md
        contact.md: red-sitmun/contacto.md
  - print-site:  # Must be the last plugin listed here
     add_to_navigation: true
     print_page_title: 'Versión Imprimible'
     # Table of contents
     add_table_of_contents: true
     toc_title: 'Table of Contents'
     toc_depth: 6

nav:
  - Inicio: index.md
  - ¿Qué es SITMUN?:
      - Descripción:
          - que-es-sitmun/descripcion/index.md
          - que-es-sitmun/descripcion/clientes.md
          - que-es-sitmun/descripcion/servidores.md
      - Arquitectura:
          - que-es-sitmun/arquitectura/index.md
          - Diseño de los servicios: que-es-sitmun/arquitectura/diseno.md
          - API: que-es-sitmun/arquitectura/api.md
      - Hoja de ruta:
          - que-es-sitmun/hoja-de-ruta/index.md
          - Propuestas:
              - que-es-sitmun/hoja-de-ruta/propuestas/mas-info-avanzado.md
              - que-es-sitmun/hoja-de-ruta/propuestas/mejora-ui-login-dashboard-cliente.md
              - que-es-sitmun/hoja-de-ruta/propuestas/app-turismo.md
              - que-es-sitmun/hoja-de-ruta/propuestas/informe.md
  - Guías y manuales de usuario:
      - Primeros pasos:
          - usuario/primeros-pasos/requisitos.md
          - Primera instalación: usuario/primeros-pasos/instalacion.md
          - usuario/primeros-pasos/configuracion.md
          - usuario/primeros-pasos/solucion-problemas.md
      - Guías:
          - De cero al primer proyecto:
              - Introducción: usuario/guias/primer-proyecto/index.md
              - Primera entrada al administrador: usuario/guias/primer-proyecto/primera-entrada.md
              - "Paso 1: Territorio, rol y usuario público": usuario/guias/primer-proyecto/paso-1-territorio-rol-usuario.md
              - "Paso 2: Servicios": usuario/guias/primer-proyecto/paso-2-servicios.md
              - "Paso 3: Capas": usuario/guias/primer-proyecto/paso-3-capas.md
              - "Paso 4: Grupos de capas y capas de fondo": usuario/guias/primer-proyecto/paso-4-grupos-y-fondos.md
              - "Paso 5: Árbol de capas": usuario/guias/primer-proyecto/paso-5-arbol.md
              - "Paso 6: Herramientas (tareas)": usuario/guias/primer-proyecto/paso-6-herramientas.md
              - "Paso 7: Aplicación": usuario/guias/primer-proyecto/paso-7-aplicacion.md
              - "Paso 8: Comprobar en el visor": usuario/guias/primer-proyecto/paso-8-comprobar.md
              - Problemas frecuentes: usuario/guias/primer-proyecto/problemas-frecuentes.md
              - Glosario: usuario/guias/primer-proyecto/glosario.md
          - Añadir OpenStreetMap como mapa de fondo: usuario/guias/mapa-fondo-openstreetmap.md
          - usuario/guias/personalizacion.md
  - Manual de desarrollador:
      - Cómo contribuir: desarrollador/contribuir.md
  - La red SITMUN:
      - Licencia: red-sitmun/licencia.md
      - Contacto: red-sitmun/contacto.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: squidfunk
      repo: mkdocs-material
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - plantuml_markdown:
      server: http://www.plantuml.com/plantuml
      format: svg
  - markdown_grid_tables
